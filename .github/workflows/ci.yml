name: CI

# 비용을 줄이는 규칙:
#  - 문서만 바뀐 push(README·docs·*.md·LICENSE)는 아예 돌지 않음
#  - 같은 브랜치에 새 push 가 오면 돌던 이전 실행은 취소
#  - unit(타입 검사·단위 테스트·빌드, OS 당 1개)은 항상, e2e(OS × 서버 종류 15개)는 서버 쪽 코드가 바뀐 push 에만
#    "바뀐" 기준은 이 push 직전 커밋 (PR 은 대상 브랜치) — 브랜치에서 한 번 서버를 건드렸다고 그 뒤 웹만 고친 push 까지 e2e 를 돌리지 않게
#    (main 으로의 push 와 수동 실행은 항상 e2e 까지. 분류 job 이 깨져도 main 은 돈다)
on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      modpack_version:
        description: "모드팩 E2E 에 쓸 Modrinth 모드팩 versionId (비우면 건너뜀). ubuntu · vanilla job 에서 한 번만 돈다"
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter 가 PR 의 바뀐 파일 목록을 API 로 읽을 때
  pull-requests: read

defaults:
  run:
    # Windows 에서도 같은 스크립트를 쓰도록 bash (러너에 Git Bash 가 있음)
    shell: bash

jobs:
  # 서버 쪽 코드가 바뀌었는지 — e2e 를 돌릴지 정하는 데만 쓴다
  changes:
    name: 바뀐 파일 분류
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
      # 무엇과 비교할지:
      #  - pull_request: 비워 두면 paths-filter 가 PR 대상 브랜치와 비교한다 (API 로 바뀐 파일 목록을 읽음)
      #  - push: 이 push 직전 커밋(github.event.before). 새 브랜치의 첫 push(before 가 0000…)나 force push 는
      #    직전 커밋을 믿을 수 없으니 기본 브랜치(main)와 비교한다 (서버 쪽이 하나라도 다르면 e2e — 안전한 쪽으로)
      #  paths-filter 의 base 는 브랜치 이름뿐 아니라 커밋 SHA 도 받는다
      - name: 비교 기준 정하기
        id: base
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ || "$FORCED" == "true" ]]; then
            echo "기준: 기본 브랜치 $DEFAULT_BRANCH (before=$BEFORE forced=$FORCED)"
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "기준: 직전 커밋 $BEFORE"
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # push 가 아니면 빈 값 → paths-filter 기본 동작 (PR 대상 브랜치 / 기본 브랜치)
          base: ${{ steps.base.outputs.ref }}
          filters: |
            e2e:
              - "packages/server/**"
              - "packages/shared/**"
              - "package-lock.json"
              - "scripts/**"
              - ".github/workflows/ci.yml"

  unit:
    name: unit · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # 실패 요약을 읽기 쉽게 색상 코드 없이
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 테스트
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: 빌드
        run: npm run build
      # 실패하면 출력 마지막 부분을 주석(annotation)으로 남긴다 — 로그인 없이도 실패 원인을 볼 수 있게
      - name: 실패 내용 요약
        if: failure()
        run: |
          f=test-output.log
          [ -f "$f" ] || exit 0
          body=$(tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=unit ${{ matrix.os }} ${f}::${body}"

  # 새 서버 만들기 → 켜기 → 끄기 → 삭제 (이 job 의 서버 종류만). 그 OS 에서 새 서버 만들기를 켠 단계부터 실제로 돈다 (아니면 건너뜀).
  # 종류마다 몇 분씩 걸려서 job 을 나눠 병렬로 돈다. unit 이 깨지면 돌리지 않는다 (어차피 같은 코드라 실패할 확률이 높고 15개 job 이 낭비됨).
  # always() 는 changes job 이 실패·취소돼도 이 조건을 평가하게 하려는 것 — 그래야 main push 와 수동 실행이 분류 실패에 가려 건너뛰지 않는다.
  # unit 은 result 로 직접 확인한다 (always() 를 쓰면 needs 실패가 자동으로 건너뛰기를 만들지 않으므로).
  e2e:
    name: e2e · ${{ matrix.os }} · ${{ matrix.loader }}
    needs: [changes, unit]
    if: >-
      always()
      && needs.unit.result == 'success'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || needs.changes.outputs.e2e == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        loader: [fabric, paper, forge, neoforge, vanilla]
    runs-on: ${{ matrix.os }}
    # 모드팩 E2E 를 함께 도는 job 은 모드 수백 개를 받고 불러오느라 더 길게
    timeout-minutes: ${{ inputs.modpack_version != '' && matrix.os == 'ubuntu-latest' && matrix.loader == 'vanilla' && 90 || 45 }}
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 테스트용 일회성 서버를 띄우려면 eula=true 가 필요해서, 이 저장소의 CI 를 돌리는 사람이 Minecraft EULA
      # (https://aka.ms/MinecraftEULA) 에 동의한다는 뜻으로 아래 값을 켠다. 앱의 실제 화면에서는 여전히 사용자가 직접 체크해야 한다.
      #
      # 받는 파일(JDK·로더 설치기·서버 jar)은 캐시하지 않는다: E2E 는 워커마다 임시 BLOCKPILOT_HOME(test/setup.ts)을 새로 만들고,
      # "JDK 를 앱 폴더에 받아서" 케이스는 일부러 받아 둔 런타임을 무시하므로 캐시가 있어도 쓰이지 않는다. 캐시되는 건 npm(setup-node) 뿐.
      - name: 실제 서버 만들기 E2E
        # 단계 제한 시간을 넘기면 '실패'로 처리돼 아래 요약이 남는다 (작업 전체 제한에 걸리면 '취소'라 요약이 안 남음)
        timeout-minutes: ${{ inputs.modpack_version != '' && matrix.os == 'ubuntu-latest' && matrix.loader == 'vanilla' && 80 || 35 }}
        run: |
          set -o pipefail
          npm run test:e2e --workspace=packages/server 2>&1 | tee e2e-output.log
        env:
          BLOCKPILOT_E2E: "1"
          BLOCKPILOT_E2E_ACCEPT_EULA: "1"
          BLOCKPILOT_E2E_LOADERS: ${{ matrix.loader }}
          # Linux·Windows 에서는 JDK 를 앱 폴더에 받아 쓰는 경로도 한 번 더 확인 (fabric job 에서만)
          BLOCKPILOT_E2E_JDK_DOWNLOAD: ${{ matrix.os != 'macos-latest' && matrix.loader == 'fabric' && '1' || '' }}
          # 수동 실행 때 modpack_version 을 주면 모드팩 E2E 도 (ubuntu · vanilla job 한 곳에서만 — 가장 빨리 끝나는 job)
          BLOCKPILOT_E2E_MODPACK_VERSION: ${{ matrix.os == 'ubuntu-latest' && matrix.loader == 'vanilla' && inputs.modpack_version || '' }}
      - name: 실패 내용 요약
        if: failure()
        run: |
          f=e2e-output.log
          [ -f "$f" ] || exit 0
          body=$(tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=e2e ${{ matrix.os }} ${{ matrix.loader }} ${f}::${body}"
